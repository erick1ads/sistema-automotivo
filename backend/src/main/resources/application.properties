
spring.application.name=sistema-automotivo
server.port=8080

# Banco de dados H2 em arquivo local
spring.datasource.url=jdbc:h2:file:./data/estoque-veiculos
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
$env:DB_USERNAME = "root"
$senha = Read-Host "Digite a senha do MySQL" -AsSecureString
$env:DB_PASSWORD = [System.Net.NetworkCredential]::new("", $senha).Password